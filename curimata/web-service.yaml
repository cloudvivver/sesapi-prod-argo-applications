apiVersion: v1
kind: Service
metadata:
  name: curimata-service
  namespace: curimata
  labels:
    app: curimata
    environment: production
spec:
  selector:
    app: curimata
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
