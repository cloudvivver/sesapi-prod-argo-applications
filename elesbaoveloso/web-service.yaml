apiVersion: v1
kind: Service
metadata:
  name: elesbaoveloso-service
  namespace: elesbaoveloso
  labels:
    app: elesbaoveloso
    environment: production
spec:
  selector:
    app: elesbaoveloso
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
