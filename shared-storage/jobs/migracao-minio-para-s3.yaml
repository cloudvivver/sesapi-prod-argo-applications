# Copia os objetos do tenant no MinIO (object-storage) para o PVC S3 (Mountpoint), convertendo o layout
# de chaves do SDK (prd/<kind>/<tenant>/, saude/<tenant>/<modulo>/) para o layout de filesystem.
# Não aplicar direto: usar ./run-migracao.sh <dir> minio (substitui __NAMESPACE__, __DATABASE_PROD__).
# Requer o Secret minio-s3-credentials no namespace. O mc grava em emptyDir (usa rename), nunca no mount S3.
apiVersion: batch/v1
kind: Job
metadata:
  name: migracao-s3-minio
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/name: cuidar
    app.kubernetes.io/component: migracao-s3
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/component: migracao-s3
    spec:
      restartPolicy: Never
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      initContainers:
        - name: baixar-minio
          image: cgr.dev/chainguard/minio-client@sha256:19c80ef13b3bec25196b00c24345195f0d0e1305a339cebf6dc7d44b85782817
          env:
            - name: HOME
              value: /tmp
            - name: DB
              value: __DATABASE_PROD__
          envFrom:
            - secretRef:
                name: minio-s3-credentials
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              mc alias set minio http://minio.object-storage.svc.cluster.local:9000 "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY"
              baixar() {
                if mc ls "minio/cuidar-storage/$1" 2>/dev/null | grep -q .; then
                  mkdir -p "$2"
                  mc mirror --quiet "minio/cuidar-storage/$1" "$2"
                else
                  echo "vazio: $1"
                fi
              }
              baixar "prd/sigtap/$DB/" /stage/raw/prd/sigtap
              baixar "prd/sia/$DB/" /stage/raw/prd/sia
              baixar "saude/$DB/" /stage/raw/saude
              find /stage/raw -type f | wc -l
          volumeMounts:
            - name: stage
              mountPath: /stage
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
      containers:
        - name: copiar
          image: alpine:3.19
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              /bin/sh /scripts/mapear-minio.sh /stage/raw /stage/mapeado
              /bin/sh /scripts/copiar-para-s3.sh /stage/mapeado /s3
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: stage
              mountPath: /stage
            - name: s3
              mountPath: /s3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
      volumes:
        - name: scripts
          configMap:
            name: migracao-s3-scripts
        - name: stage
          emptyDir:
            sizeLimit: 5Gi
        - name: s3
          persistentVolumeClaim:
            claimName: s3-storage-pvc
