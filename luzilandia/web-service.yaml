apiVersion: v1
kind: Service
metadata:
  name: luzilandia-service
  namespace: luzilandia
  labels:
    app: luzilandia
    environment: production
spec:
  selector:
    app: luzilandia
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
