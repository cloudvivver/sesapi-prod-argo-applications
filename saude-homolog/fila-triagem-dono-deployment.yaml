# Dono da fila de acolhimento (rake fila_triagem:dono, no saude-publica-legado).
# Processo único por banco: escuta as notificações das tabelas da fila (LISTEN fila_triagem),
# reconstrói os escopos com tela aberta e publica os snapshots no redis-fila, de onde o
# gateway triagem-events avisa as telas. Uma segunda instância não inicia (trava consultiva
# no banco), por isso 1 réplica e Recreate: o pod antigo sai antes de o novo subir.
# Sem ele, as telas continuam funcionando pelo polling de antes (o gateway responde
# "unavailable" quando o sinal de vida do dono some).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fila-triagem-dono
  namespace: saude-homolog
  labels:
    app: fila-triagem-dono
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: fila-triagem-dono
  template:
    metadata:
      labels:
        app: fila-triagem-dono
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: dono
          image: 961341521437.dkr.ecr.sa-east-1.amazonaws.com/saude-publica-web:master-208
          command: ["/bin/bash", "-c"]
          args:
            - |
              export RBENV_ROOT=/usr/local/rbenv
              export PATH="${RBENV_ROOT}/bin:${RBENV_ROOT}/shims:${PATH}"
              eval "$(rbenv init - bash)"
              # exec: o rake recebe o SIGTERM e encerra o ciclo (solta a trava e o LISTEN).
              exec bundle exec rake fila_triagem:dono
          env:
            # LISTEN e a trava consultiva são de sessão: precisam da instância do banco,
            # não do RDS Proxy (DATABASE_HOST do ConfigMap env).
            - name: FILA_TRIAGEM_ESCUTA_HOST
              value: db-viverdb.cb8m6qcy2cyh.sa-east-1.rds.amazonaws.com
            - name: FILA_TRIAGEM_ESCUTA_PORT
              value: "5432"
            - name: DATABASE_HOST
              value: db-viverdb.cb8m6qcy2cyh.sa-east-1.rds.amazonaws.com
            # Teto de recálculo por escopo: 30 s = no máximo 2 por minuto, o mesmo que o polling
            # de uma tela. A primeira mudança de uma rajada chega em ~1 s; a seguinte, em até 30 s.
            - name: FILA_TRIAGEM_INTERVALO_MINIMO
              value: "30"
            # Reconciliação de todos os escopos ativos. Subir para 300 só depois de
            # rake fila_triagem:conferir sem divergências (docs/expectativa-producao.md).
            - name: FILA_TRIAGEM_RECONCILIAR_S
              value: "60"
            - name: FILA_TRIAGEM_ARQUIVO_VIVO
              value: /tmp/fila_triagem_vivo
            - name: FILA_TRIAGEM_VERBOSO
              value: "1"
          envFrom:
            - configMapRef:
                name: env
            - secretRef:
                name: app-secrets
            # FILA_TRIAGEM_REDIS_URL (redis-fila, com senha).
            - secretRef:
                name: triagem-events
          # O dono toca o arquivo a cada passo (no máximo ~1 s parado, fora reconstruções);
          # 2 min sem tocar = travado: o kubelet reinicia o pod.
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - test $(( $(date +%s) - $(stat -c %Y /tmp/fila_triagem_vivo) )) -lt 120
            initialDelaySeconds: 180
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1536Mi"
      restartPolicy: Always
