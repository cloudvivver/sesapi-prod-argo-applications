# Rota do stream SSE da fila de acolhimento, separada do webhomolog-ingress porque:
# - SSE precisa de buffering desligado (o principal usa proxy-buffering on);
# - cada tela mantém uma conexão aberta, e as telas de um hospital saem pelo mesmo IP:
#   o limite de 50 conexões por IP do principal não serve (o gateway limita por FILA_LIMITE);
# - a URL leva o token de acesso (?token=...), então o log de acesso fica desligado.
# Só o caminho exato do stream é exposto; /fila-eventos/health fica interno.
# O certificado é o do webhomolog-ingress (gerado pelo cert-manager lá).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: triagem-events-ingress
  namespace: saude-homolog
  labels:
    app: triagem-events
    environment: homolog
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"   # heartbeat do gateway a cada 15s
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    nginx.ingress.kubernetes.io/enable-access-log: "false"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/ssl-protocols: "TLSv1.2 TLSv1.3"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - homolog.saude.pi.gov.br
      secretName: webhomolog-tls
  rules:
    - host: homolog.saude.pi.gov.br
      http:
        paths:
          - path: /fila-eventos/stream
            pathType: Exact
            backend:
              service:
                name: triagem-events
                port:
                  number: 9293
