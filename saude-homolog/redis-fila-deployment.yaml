# Redis exclusivo da fila de acolhimento (snapshots da grade, versões e avisos).
# Separado do Redis do app porque:
# - o snapshot contém dados exibidos na grade (nomes, prontuário, telefone): exige senha;
# - o Redis do app usa allkeys-lfu e pode descartar o snapshot; aqui não há descarte.
# Sem persistência de propósito: tudo é derivado do banco e o dono da fila reconstrói
# os escopos se este Redis reiniciar.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-fila
  namespace: saude-homolog
  labels:
    app: redis-fila
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redis-fila
  template:
    metadata:
      labels:
        app: redis-fila
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7.4
          imagePullPolicy: IfNotPresent
          env:
            - name: REDIS_FILA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: triagem-events
                  key: REDIS_FILA_PASSWORD
          args:
            - redis-server
            - --requirepass
            - $(REDIS_FILA_PASSWORD)
            - --protected-mode
            - "yes"
            - --maxmemory
            - 256mb
            - --maxmemory-policy
            - noeviction
            - --save
            - ""
            - --appendonly
            - "no"
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "320Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: dados
              mountPath: /data
      volumes:
        - name: dados
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis-fila
  namespace: saude-homolog
  labels:
    app: redis-fila
spec:
  type: ClusterIP
  selector:
    app: redis-fila
  ports:
    - name: redis
      port: 6379
      targetPort: redis
