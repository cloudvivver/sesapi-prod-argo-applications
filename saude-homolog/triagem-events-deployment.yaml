# Gateway SSE da fila de acolhimento (github.com/cloudvivver/saude-triagem-events).
# Avisa cada tela da nova versão da fila do seu escopo, lida no Redis, onde o dono da
# fila (rake fila_triagem:dono, no saude-publica-legado) publica os snapshots.
# Só trafega o número da versão; nenhum dado de paciente.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: triagem-events
  namespace: saude-homolog
  labels:
    app: triagem-events
spec:
  replicas: 1
  selector:
    matchLabels:
      app: triagem-events
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: triagem-events
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        # Usuário "nonroot" da imagem distroless; numérico para o kubelet poder conferir.
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: triagem-events
          image: 961341521437.dkr.ecr.sa-east-1.amazonaws.com/saude-triagem-events:de10f54
          imagePullPolicy: IfNotPresent
          ports:
            - name: sse
              containerPort: 9293
          env:
            # Mesmo prefixo do dono: fila_triagem:<banco do Rails> (DATABASE_PROD).
            - name: FILA_PREFIXO
              value: "fila_triagem:saude_devel_pi"
            - name: FILA_LIMITE
              value: "200"
          envFrom:
            # TRIAGEM_EVENTS_SECRET (compartilhado com o Rails, assina o token) e
            # FILA_REDIS_URL (Redis exclusivo da fila, com senha: redis-fila).
            - secretRef:
                name: triagem-events
          # TCP, não /fila-eventos/health: o health responde 503 enquanto o dono da fila
          # não estiver ativo, e o gateway já recusa streams (503) nesse caso, levando a
          # tela de volta ao polling. Use o /fila-eventos/health para monitoramento.
          readinessProbe:
            tcpSocket:
              port: sse
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: sse
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "500m"
              memory: "128Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
