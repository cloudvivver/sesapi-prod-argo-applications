apiVersion: apps/v1
kind: Deployment
metadata:
  name: sidekiq
  namespace: bomjesus
  labels:
    app: sidekiq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sidekiq
  template:
    metadata:
      labels:
        app: sidekiq
    spec:
      containers:
        - name: sidekiq
          image: 961341521437.dkr.ecr.sa-east-1.amazonaws.com/saude-publica-web:master-222
          command: ["/bin/bash", "-c"]
          args:
            - |
              # Configurar PATH para rbenv
              export PATH="/usr/local/rbenv/shims:/usr/local/rbenv/bin:$PATH"
              bundle exec sidekiq -C config/sidekiq.yml
          volumeMounts:
            - name: shared-storage
              mountPath: /mnt/compartilhado/cuidar_bomjesus_pi
          envFrom:
            - configMapRef:
                name: env
            - secretRef:
                name: app-secrets
          resources:
            requests:
              cpu: "400m"
              memory: "1Gi"
            limits:
              cpu: "800m"
              memory: "2Gi"

      volumes:
        - name: shared-storage
          persistentVolumeClaim:
            claimName: s3-storage-pvc

      restartPolicy: Always
